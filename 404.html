<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moved</title>
    <script>
      // TasmoFleet moved to the hellwand organization (2026-11-06). The old project
      // site at /tasmofleet/ was the demo, so every old path maps into /demo/.
      (function () {
        var p = location.pathname;
        if (p === "/tasmofleet" || p.indexOf("/tasmofleet/") === 0) {
          var rest = p.replace(/^\/tasmofleet\/?/, "");
          location.replace(
            "https://hellwand.github.io/tasmofleet/demo/" +
              rest +
              location.search +
              location.hash,
          );
        }
      })();
      // Nova moved to the hellwand organization (2026-11-12). The project site keeps
      // its structure, so old paths map one to one.
      (function () {
        var p = location.pathname;
        if (p === "/nova" || p.indexOf("/nova/") === 0) {
          var rest = p.replace(/^\/nova\/?/, "");
          location.replace(
            "https://hellwand.github.io/nova/" +
              rest +
              location.search +
              location.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <p>Page not found.</p>
    <p>
      Nova now lives at
      <a href="https://hellwand.github.io/nova/">hellwand.github.io/nova</a>.
    </p>
    <p>
      TasmoFleet now lives at
      <a href="https://hellwand.github.io/tasmofleet/"
        >hellwand.github.io/tasmofleet</a
      >.
    </p>
  </body>
</html>
